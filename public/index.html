<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ψώνια & Μενού</title>
<meta name="description" content="Λίστες σούπερ μάρκετ, ιστορικό και μηνιαίο πρόγραμμα φαγητού.">
<meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1620" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ψώνια">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-v2.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon-v2.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ψώνια & Μενού">
<meta property="og:title" content="Ψώνια & Μενού">
<meta property="og:description" content="Λίστες σούπερ μάρκετ, καταστήματα και μηνιαίο πρόγραμμα φαγητού.">
<meta property="og:url" content="https://super.myportofolio.eu/">
<meta property="og:image" content="https://super.myportofolio.eu/og-image-v2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://super.myportofolio.eu/og-image-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Βασικό σετ (ασφαλές) και μετά το πλήρες με τους άξονες Flare/Volume για τους τίτλους -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400..800&family=EB+Garamond:ital,wght@0,500;0,700;1,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght,FLAR,VOLM@400..800,0..100,0..100&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app" id="view"></main>

<form class="composer" id="composer" data-form="quick-add" autocomplete="off" hidden>
  <button type="button" class="basket-btn" id="basketBtn" data-act="basket-sheet" aria-label="Στο καλάθι">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18l-1.6 9.2a2 2 0 0 1-2 1.8H6.6a2 2 0 0 1-2-1.8z"/><path d="M8 9l3-5M16 9l-3-5M9 13v3M15 13v3"/></svg>
    <span class="badge num" id="basketCount" hidden>0</span>
  </button>
  <label class="sr" for="qa">Πρόσθεσε προϊόν</label>
  <input id="qa" name="name" autocomplete="off" aria-autocomplete="list" placeholder="Πρόσθεσε προϊόν, π.χ. Γάλα 2" maxlength="80" enterkeyhint="done">
  <button class="composer-btn" type="submit" aria-label="Προσθήκη">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</form>

<div class="suggest" id="suggest" role="listbox" aria-label="Προτάσεις" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<nav class="tabs" aria-label="Ενότητες">
  <button class="tab" data-tab="list" type="button">
    <span class="tab-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20.5 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg></span>
    <span>Λίστα</span>
  </button>
  <button class="tab" data-tab="history" type="button">
    <span class="tab-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3 2"/></svg></span>
    <span>Ιστορικό</span>
  </button>
  <button class="tab" data-tab="meals" type="button">
    <span class="tab-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
    <span>Φαγητό</span>
  </button>
  <button class="tab" data-tab="stores" type="button">
    <span class="tab-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
    <span>Ρυθμίσεις</span>
  </button>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-act="close-sheet"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" id="sheetPanel"></div>
</div>

<div id="print-root" aria-hidden="true"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
